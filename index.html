<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - APPAREIL</title>
    <link rel="icon" type="image/png" href="img/logo2.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body class="login-body">

    <div class="login-wrapper">
        <div class="login-logo">
            <img src="img/logo_index.png" alt="APPAREIL">
        </div>

        <div class="login-card">
            <h1>Inicio de Sesión</h1>
            <p class="subtitle">Gestor de Licitaciones — APPAREIL</p>

            <form id="loginForm">
                <div class="field">
                    <label for="username">Correo corporativo</label>
                    <input type="email" id="username" placeholder="appareil@appareil.cl" required>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="login-row">
                    <label><input type="checkbox" id="remember"> Recordarme</label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login">Ingresar</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qboawjjuzgijgtyjzqiw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HAuwDGL-5bWi5E2GHUBUKA_euUS1ig7';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. REVISIÓN INICIAL: ¿Dejamos pasar al usuario?
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                // Leemos si el usuario pidió ser recordado la última vez
                const rememberMe = localStorage.getItem('remember_me');
                // Revisamos si esta es la misma pestaña donde inició sesión
                const currentTabSession = sessionStorage.getItem('active_tab');

                // Si NO marcó "Recordarme" y cerró el navegador (no hay active_tab): lo deslogueamos.
                if (rememberMe === 'false' && !currentTabSession) {
                    supabaseClient.auth.signOut();
                } else {
                    // Si marcó "Recordarme" o sigue en la misma sesión, pasa directo.
                    window.location.href = 'dashboard.html';
                }
            }
        });

        const form = document.getElementById('loginForm');
        const btn = form.querySelector('.btn-login');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            // ¡NUEVO! Ahora sí capturamos si la casilla está marcada o no
            const remember = document.getElementById('remember').checked; 

            if (!email.endsWith('@appareil.cl')) {
                alert('Acceso denegado. Debes ingresar con un correo corporativo (@appareil.cl).');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Validando...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    alert('Correo o contraseña incorrectos. Verifica e intenta de nuevo.');
                    console.error(error.message);
                } else {
                    // 2. GUARDAMOS LA CONFIGURACIÓN DEL USUARIO
                    localStorage.setItem('remember_me', remember ? 'true' : 'false');
                    sessionStorage.setItem('active_tab', 'true'); // Marcamos que la pestaña está activa
                    
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                alert('Ocurrió un error de conexión.');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            }
        });
    </script>
</body>
</html>
